# --------------------------------------------------------------------------- #
# Isolated Qdrant instance for rag-showcase.
#   docker compose up -d      # start
#   docker compose down       # stop (storage volume survives)
#   docker compose down -v    # stop and wipe the index
#
# Storage is bind-mounted into the project folder so the index lives on the
# same external volume as the code — nothing is written to the host disk.
# --------------------------------------------------------------------------- #
name: rag-showcase

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: rag-showcase-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
      # Keep the payload index in memory: the corpus is small, latency wins.
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 4
    healthcheck:
      # The image is distroless: use Qdrant's own readiness endpoint via its
      # bundled healthcheck binary rather than curl/wget.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
