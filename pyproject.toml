[project]
name = "rag_documents"
version = "1.0.0"
description = "Production-grade asynchronous RAG microservice: Qdrant dense retrieval + cross-encoder reranking, SSE streaming, Langfuse tracing and Ragas evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Michal Zasiadczuk" }]
keywords = ["rag", "qdrant", "fastapi", "reranker", "langfuse", "ragas"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.11",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "pypdf>=4.3",
    "langchain-text-splitters>=0.3",
    "openai>=1.40",
    "langfuse>=3.0",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.4.3,<0.5",
    "datasets>=3.0",
    "langchain-openai>=0.2",
    # Ragas still imports `langchain_community.chat_models.vertexai`, which the
    # langchain 1.x line removed — pin the last release that provides it.
    "langchain-community>=0.3.31,<0.4",
    "pandas>=2.2",
]

[project.scripts]
rag-ingest = "src.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Tooling dependencies (PEP 735). `uv sync` and `uv run` install this group by
# default, so `uv run pytest` works straight after a clone.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.uv]
# uv.lock pins the full graph; requirements.txt is exported from it.
package = true

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval"]
extend-exclude = [".venv", ".cache", ".direnv", "qdrant_storage", "documents", "eval/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "ARG", "RUF", "ANN", "ASYNC"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001", "ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "eval"]

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "langfuse.*",
    "ragas.*",
    "datasets.*",
    "sse_starlette.*",
    "langchain_text_splitters.*",
    "langchain_openai.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
